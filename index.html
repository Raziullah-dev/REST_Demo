<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffb800">
<title>Restaurant Menu</title>

<style>
:root{
  --yellow:#ffb800;
  --ink:#202322;
  --muted:#777;
  --line:#ececec;
  --paper:#fff;
  --bg:#f8f9fa;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid #b88100;outline-offset:3px;
}
button{border:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

.sidebar{
  width:82px;position:fixed;inset:0 auto 0 0;
  background:white;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  gap:20px;padding:25px 0;z-index:30;
}
.side-button{
  width:46px;height:46px;border-radius:15px;
  background:transparent;color:#777;
  display:grid;place-items:center;font-size:22px;
}
.side-button.active{background:#fff5d7;color:#a36d00}
.side-button:hover{background:#f3f3f3}
.side-bottom{margin-top:auto}
.app{margin-left:82px}
.topbar{
  height:94px;position:sticky;top:0;z-index:20;
  background:#fffffff5;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 32px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:52px;height:52px;border-radius:14px;
  object-fit:contain;background:#fff6d9;
}
.brand-symbol{
  width:52px;height:52px;border-radius:14px;
  background:var(--yellow);display:grid;place-items:center;
  font-size:27px;
}
.brand-name{font-size:23px;font-weight:900;letter-spacing:-1px}
.brand-caption{
  margin-top:4px;font-size:10px;letter-spacing:2px;color:#777;
}
.location-button{
  display:flex;align-items:center;gap:11px;
  background:none;text-align:left;padding:7px;
}
.location-icon{
  background:#f6f6f6;width:42px;height:42px;
  border-radius:50%;display:grid;place-items:center;font-size:21px;
}
.location-label{font-size:10px;color:#777;letter-spacing:1px}
.location-value{font-size:14px;font-weight:700;margin-top:5px}
.top-cart{
  background:#fff4d2;border-radius:12px;padding:12px 15px;
  font-weight:700;white-space:nowrap;
}
.header-actions{display:flex;align-items:center;gap:12px}
.demo-note{
  padding:7px 20px;text-align:center;font-size:11px;
  background:#fff8e7;color:#806015;
}
.content{max-width:1380px;margin:auto;padding:22px 30px 110px}
.hero{
  position:relative;overflow:hidden;border-radius:28px;
  min-height:340px;background:#103a2c;
  display:grid;grid-template-columns:1.1fr 1fr;
  align-items:center;color:white;
}
.hero:before{
  content:"";position:absolute;width:450px;height:450px;
  border:1px solid #ffffff16;border-radius:50%;
  right:-60px;top:-50px;
}
.hero-copy{position:relative;z-index:2;padding:38px}
.hero-tag{
  display:inline-block;padding:8px 13px;
  background:var(--yellow);color:#222;border-radius:50px;
  font-size:11px;font-weight:800;letter-spacing:1px;
}
.hero h1{
  font-size:clamp(34px,4vw,62px);line-height:1.03;
  letter-spacing:-2px;margin:19px 0 14px;
}
.hero p{color:#d2e5db;line-height:1.7;max-width:370px;font-size:14px}
.hero-button{
  display:inline-block;background:var(--yellow);
  color:#222;padding:13px 20px;border-radius:12px;
  font-weight:800;margin-top:12px;
}
.hero-art{
  position:relative;display:grid;place-items:center;
  padding:20px;min-height:300px;
}
.hero-art img{
  width:100%;height:300px;object-fit:contain;
  filter:drop-shadow(0 20px 25px #0004);
}
.hero.custom-banner{
  display:block;padding:0;background:#103a2c;min-height:0;
}
.hero.custom-banner>img{display:block;width:100%;height:auto}
.categories-wrap{
  position:sticky;top:94px;z-index:15;
  background:var(--bg);padding:17px 0;
}
.categories{
  display:flex;gap:10px;overflow-x:auto;
  scrollbar-width:thin;padding-bottom:5px;
}
