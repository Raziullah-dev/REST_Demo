<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[RESTAURANT NAME] — Menu & Contact</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Arial,sans-serif}
body{background:#111;color:#fff}
header{padding:30px 18px;text-align:center;background:linear-gradient(160deg,#1f1f1f,#333)}
header img{width:96px;height:96px;border-radius:16px;object-fit:cover;margin-bottom:12px}
header h1{font-size:24px}
header p{color:#bbb;margin-top:6px}
.buttons{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}
.wa{background:#25D366;color:#fff}
.call{background:#fff;color:#111}
section{max-width:520px;margin:0 auto;padding:20px}
h2{font-size:18px;margin-bottom:12px;color:#ffd166}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card img{
  display:block;
  width:100%;
  height:auto;
}.card img{width:100%;height:110px;object-fit:cover}
.card div{padding:10px}
.card h3{font-size:15px}
.card p{font-size:13px;color:#aaa;margin-top:4px}
footer{text-align:center;padding:22px;color:#888;font-size:12px}
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Logo">
  <h1>[RESTAURANT NAME]</h1>
  <p>[AREA] • [CUISINE]</p>
  <div class="buttons">
    <a class="wa" href="https://wa.me/92XXXXXXXXXX">WhatsApp</a>
    <a class="call" href="tel:+92XXXXXXXXXX">Call Now</a>
  </div>
</header>

<section>
  <h2>مقبول آئٹمز</h2>
  <div class="grid">
    <div class="card">
      <img src="images/item1.jpg" alt="Item 1">
      <div><h3>[ITEM 1 NAME]</h3><p>Rs. [PRICE]</p></div>
    </div>
    <div class="card">
      <img src="images/item2.jpg" alt="Item 2">
      <div><h3>[ITEM 2 NAME]</h3><p>Rs. [PRICE]</p></div>
    </div>
    <div class="card">
      <img src="images/item3.jpg" alt="Item 3">
      <div><h3>[ITEM 3 NAME]</h3><p>Rs. [PRICE]</p></div>
    </div>
    <div class="card">
      <img src="images/item4.jpg" alt="Item 4">
      <div><h3>[ITEM 4 NAME]</h3><p>Rs. [PRICE]</p></div>
    </div>
  </div>
</section>

<footer>Sample preview — replace menu, photos and contact details before sending to a client.</footer>
</body>
</html>
